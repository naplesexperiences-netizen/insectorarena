name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html-lint:
    name: HTML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install HTMLHint
        run: npm install -g htmlhint@1.1.4

      - name: Run HTMLHint
        run: htmlhint --config .htmlhintrc index.html gioca.html

  link-check:
    name: Broken link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run lychee (offline, solo collegamenti interni)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --exclude data:.*
            './index.html'
            './gioca.html'
          fail: true
          format: markdown

  manifest:
    name: Manifest e sitemap validi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Il manifest e' JSON valido e punta a file esistenti
        run: |
          python3 - <<'PY'
          import json, os, sys
          m = json.load(open('manifest.webmanifest', encoding='utf-8'))
          mancanti = []
          for voce in m.get('icons', []) + m.get('screenshots', []):
              p = voce['src'].lstrip('./')
              if not os.path.exists(p):
                  mancanti.append(p)
          for chiave in ('name', 'start_url', 'scope', 'display', 'icons'):
              if chiave not in m:
                  mancanti.append('campo mancante: ' + chiave)
          if not os.path.exists(m['start_url'].lstrip('./')):
              mancanti.append('start_url inesistente: ' + m['start_url'])
          if mancanti:
              print('\n'.join(mancanti)); sys.exit(1)
          print('manifest a posto:', len(m['icons']), 'icone')
          PY

      - name: La sitemap e' XML valido
        run: python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse('sitemap.xml'); print('sitemap a posto')"
